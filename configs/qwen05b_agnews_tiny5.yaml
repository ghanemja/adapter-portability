# Fresh-ROOT variant of qwen05b_agnews_tiny.yaml used to verify the 5-condition
# pipeline (naive / Cross-LoRA / procrustes / ridge / oracle) end to end on CPU.
# Run: STEPS=20 MAXLEN=32 THREADS=4 CFG=configs/qwen05b_agnews_tiny5.yaml \
#      ROOT=runs/qwen05b_agnews_tiny bash experiments/run_full_cpu.sh
pair:
  family: qwen
  base_v: Qwen/Qwen2-0.5B
  base_v_next: Qwen/Qwen2.5-0.5B
  target_modules: [q_proj, k_proj, v_proj, o_proj]

anchors:
  dataset: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  split: train
  n_sequences: 16
  max_length: 32
  seed: 0

align:
  method: ridge
  ridge_lambda: 1.0
  per_layer: true
  center: true

tasks:
  - name: agnews
    adapter_path: runs/qwen05b_agnews_tiny/adapters_v/agnews
    eval_dataset: fancyzhx/ag_news
    eval_split: test
    metric: perplexity
    text_field: text
    max_eval_samples: 40

output_dir: runs/qwen05b_agnews_tiny
device: cpu
dtype: float32

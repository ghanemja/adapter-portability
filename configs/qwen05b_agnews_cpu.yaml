# Full pipeline on CPU at 0.5B: Qwen2-0.5B -> Qwen2.5-0.5B.
# Task = AG News (small parquet, distinct news domain). Anchors = wikitext
# (DIFFERENT corpus -> keeps the "anchors are not task data" property honest).
# Short sequences + tiny train/eval caps so LoRA training is bounded on CPU.
pair:
  family: qwen
  base_v: Qwen/Qwen2-0.5B
  base_v_next: Qwen/Qwen2.5-0.5B
  target_modules: [q_proj, k_proj, v_proj, o_proj]

anchors:
  dataset: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  split: train
  n_sequences: 32
  max_length: 64
  seed: 0

align:
  method: ridge
  ridge_lambda: 1.0
  per_layer: true
  center: true

tasks:
  - name: agnews
    adapter_path: runs/qwen05b_agnews/adapters_v/agnews
    eval_dataset: fancyzhx/ag_news
    eval_split: test
    metric: perplexity
    text_field: text
    max_eval_samples: 80

output_dir: runs/qwen05b_agnews
device: cpu
dtype: float32

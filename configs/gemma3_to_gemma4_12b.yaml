# Headline "motivating example" pair: Gemma 3-12B -> Gemma 4-12B.
# VERIFIED dim-matched (2026-06-15): both have hidden_size=3840, 48 layers,
# 16 q-heads / 8 kv-heads, head_dim=256 -> q/k/v/o_proj shapes identical, adapter
# maps 1:1. Vocab differs by 64 (262208 vs 262144 = added special tokens only);
# embeddings/lm_head are NOT adapted, so the transplant is unaffected. Plain-text
# anchors should tokenize identically -- assert this before trusting results
# (see tokenizer-compat check in README).
#
# COST: two 12B models -> needs a real GPU (~24-48GB; extract sequentially, free
# M_v before loading M_{v+1}). NOT for the CPU box. Both repos are GATED on HF
# (accept license + `huggingface-cli login`).
pair:
  family: gemma
  base_v: google/gemma-3-12b-pt
  base_v_next: google/gemma-4-12b-pt
  target_modules: [q_proj, k_proj, v_proj, o_proj]

anchors:
  dataset: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  split: train
  n_sequences: 2000
  max_length: 256
  seed: 0

align:
  method: ridge
  ridge_lambda: 1.0
  per_layer: true
  center: true

tasks:
  - name: gsm8k
    adapter_path: runs/gemma_adapters_v/gsm8k
    eval_dataset: gsm8k
    eval_split: test
    metric: accuracy
    text_field: question
    max_eval_samples: 300

output_dir: runs/gemma3_to_gemma4_12b
device: cuda
dtype: bfloat16
